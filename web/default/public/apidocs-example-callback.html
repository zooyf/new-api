<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Nexus Reach Authentication Callback</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        box-sizing: border-box;
        width: min(44rem, calc(100% - 2rem));
        margin: 4rem auto;
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 12px 36px rgb(15 23 42 / 8%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.65;
      }
      dl {
        display: grid;
        grid-template-columns: minmax(9rem, auto) minmax(0, 1fr);
        gap: 0.75rem 1rem;
        margin: 1.5rem 0;
      }
      dt {
        color: #475569;
        font-weight: 600;
      }
      dd {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .notice {
        padding: 0.875rem 1rem;
        border-radius: 0.75rem;
        background: #eff6ff;
        color: #1e3a8a;
      }
      .error {
        background: #fff1f2;
        color: #9f1239;
      }
      button {
        min-height: 2.5rem;
        padding: 0.5rem 0.875rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0f172a;
        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      small {
        display: block;
        margin-top: 1rem;
        color: #64748b;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #e2e8f0;
        }
        main {
          border-color: #1e293b;
          background: #0f172a;
        }
        dt,
        small {
          color: #94a3b8;
        }
        .notice {
          background: #172554;
          color: #bfdbfe;
        }
        .error {
          background: #4c0519;
          color: #fecdd3;
        }
        button {
          background: #e2e8f0;
          color: #0f172a;
        }
      }
      @media (max-width: 36rem) {
        main {
          margin: 1rem auto;
          padding: 1.25rem;
        }
        dl {
          grid-template-columns: 1fr;
          gap: 0.25rem;
        }
        dd {
          margin-bottom: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>认证回调已接收</h1>
      <p>Authentication callback received.</p>
      <p id="summary" class="notice" role="status"></p>
      <dl>
        <dt>resultCode</dt>
        <dd id="result-code">—</dd>
        <dt>algorithmBaseRespCode</dt>
        <dd id="algorithm-code">—</dd>
        <dt>reqMeasureInfoValue</dt>
        <dd id="measure-info">—</dd>
        <dt>verify_type</dt>
        <dd id="verify-type">—</dd>
        <dt>bytedToken</dt>
        <dd id="token-preview">—</dd>
      </dl>
      <button id="copy-token" type="button" disabled>
        复制 BytedToken / Copy token
      </button>
      <small>
        认证成功后，请立即把回调参数 <code>bytedToken</code> 作为请求体字段
        <code>BytedToken</code> 调用
        GetVisualValidateResult。令牌从创建认证会话起仅有效 120
        秒且只能使用一次。本示例页只在浏览器本地读取参数，不会向服务器发送令牌。
      </small>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const token = params.get('bytedToken') || ''
      const resultCode = params.get('resultCode') || ''
      const summary = document.querySelector('#summary')
      const copyButton = document.querySelector('#copy-token')

      document.querySelector('#result-code').textContent =
        resultCode || '缺失 / Missing'
      document.querySelector('#algorithm-code').textContent =
        params.get('algorithmBaseRespCode') || '—'
      document.querySelector('#measure-info').textContent =
        params.get('reqMeasureInfoValue') || '—'
      document.querySelector('#verify-type').textContent =
        params.get('verify_type') || '—'
      document.querySelector('#token-preview').textContent = token
        ? `${token.slice(0, 8)}…${token.slice(-6)}`
        : '缺失 / Missing'

      if (resultCode === '10000' && token) {
        summary.textContent =
          '认证成功。请立即复制令牌并调用 GetVisualValidateResult。Verification succeeded. Use the token immediately.'
        copyButton.disabled = false
      } else {
        summary.textContent =
          '认证未成功或回调参数不完整，请根据错误码重新发起认证。Verification failed or callback parameters are incomplete.'
        summary.classList.add('error')
      }

      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(token)
          copyButton.textContent = '已复制 / Copied'
        } catch {
          copyButton.textContent = '复制失败，请从地址栏获取 / Copy failed'
        }
      })

      if (window.history.replaceState) {
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        )
      }
    </script>
  </body>
</html>
